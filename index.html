<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="X Frame">
<meta name="theme-color" content="#0e0e10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>X Frame</title>
<style>
  :root {
    --bg: #f3f3f1;
    --card: #ffffff;
    --ink: #141414;
    --muted: #6b6b6b;
    --line: #e3e3df;
    --chip: #ebebe8;
    --accent: #1f5eff;
    --accent-ink: #ffffff;
    --hit: #17703f;
    --hit-bg: #e2f3e8;
    --miss: #b3261e;
    --miss-bg: #fbe6e4;
    --note: #7a5200;
    --note-bg: #fff1d1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e10;
      --card: #1a1a1d;
      --ink: #f2f2f2;
      --muted: #9b9ba1;
      --line: #2b2b30;
      --chip: #29292e;
      --accent: #4f7fff;
      --accent-ink: #ffffff;
      --hit: #63d69a;
      --hit-bg: #15301f;
      --miss: #ff8d84;
      --miss-bg: #3a1917;
      --note: #ffd27a;
      --note-bg: #362a0f;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button, input { font: inherit; color: inherit; }
  button {
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px calc(env(safe-area-inset-bottom) + 40px);
  }
  .top {
    position: sticky;
    top: 0;
    z-index: 5;
    display: grid;
    grid-template-columns: minmax(max-content, 1fr) minmax(0, auto) minmax(max-content, 1fr);
    align-items: center;
    gap: 8px;
    padding: calc(env(safe-area-inset-top) + 8px) 0 8px;
    background: var(--bg);
  }
  .top .mid { text-align: center; min-width: 0; }
  .top .mid b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .right { justify-self: end; }
  .eyebrow { color: var(--muted); font-size: 14px; }
  h2 { font-size: 28px; margin: 8px 0 4px; }
  .link { color: var(--accent); font-weight: 600; min-height: 44px; padding: 0 4px; white-space: nowrap; }
  .btn {
    min-height: 48px;
    padding: 0 18px;
    border-radius: 12px;
    background: var(--chip);
    font-weight: 600;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.big { width: 100%; min-height: 60px; font-size: 19px; margin-top: 12px; }
  .btn.armed { background: var(--miss); color: #fff; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin: 12px 0;
  }
  .card h3 { margin: 0 0 2px; font-size: 22px; }
  .note {
    background: var(--note-bg);
    color: var(--note);
    border-radius: 12px;
    padding: 10px 14px;
    margin: 12px 0;
    font-size: 15px;
  }
  .week-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 56px;
    border-top: 1px solid var(--line);
  }
  .week-row:first-of-type { border-top: 0; }
  .week-row .name { flex: 1; min-width: 0; }
  .week-row .btn { min-height: 44px; padding: 0 14px; }
  .pill {
    font-size: 13px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--chip);
    color: var(--muted);
    white-space: nowrap;
  }
  .pill.hit, .badge.hit, .badge.first { background: var(--hit-bg); color: var(--hit); }
  .pill.miss, .badge.miss { background: var(--miss-bg); color: var(--miss); }
  .pill.now { background: var(--accent); color: var(--accent-ink); }
  .ex-head { margin-bottom: 4px; }
  .ex-head + .ex-head { margin-top: 12px; }
  .ex-name { font-size: 19px; font-weight: 700; }
  .tag {
    display: inline-block;
    min-width: 28px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    margin-right: 6px;
  }
  .meta { color: var(--muted); font-size: 15px; }
  .stall { margin-top: 6px; }
  .set {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 8px;
    min-height: 60px;
    border-top: 1px solid var(--line);
  }
  .set:first-of-type { margin-top: 8px; }
  .set .label { color: var(--muted); font-size: 14px; line-height: 1.2; }
  .set.next .label { color: var(--accent); font-weight: 700; }
  .set .vals {
    text-align: left;
    min-height: 56px;
    font-size: 19px;
    font-weight: 600;
    padding: 0;
  }
  .set .vals small { display: block; font-size: 13px; font-weight: 500; color: var(--note); }
  .set.logged .vals { color: var(--muted); font-weight: 500; }
  .set .done { min-width: 84px; }
  .badge {
    min-width: 84px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    padding: 12px 0;
    border-radius: 12px;
  }
  .editor { grid-column: 1 / -1; padding: 4px 0 14px; }
  .lab { font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  .stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; }
  .stepper button { min-height: 56px; border-radius: 12px; background: var(--chip); font-size: 26px; font-weight: 600; }
  .stepper input {
    min-width: 0;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
  }
  .chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .chips button { min-height: 48px; border-radius: 12px; background: var(--chip); font-weight: 600; }
  .chips button.on { background: var(--accent); color: var(--accent-ink); }
  .toggle { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-top: 8px; width: 100%; text-align: left; }
  .toggle .box {
    width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--muted);
    display: grid; place-items: center; font-size: 16px; font-weight: 800; flex: none;
  }
  .toggle.on .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .actions .primary { flex: 1; }
  .sum-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .sum-row:first-of-type { border-top: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin: 8px 0 4px; }
  .stats b { display: block; font-size: 28px; }
  select {
    font: inherit; color: inherit; width: 100%; min-height: 52px; padding: 0 12px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
  }
  .inline-link { color: var(--accent); font-weight: 600; padding: 4px 0; font-size: 15px; }
  .ex-title { display: flex; align-items: flex-start; gap: 8px; }
  .ex-title .ex-name { flex: 1; min-width: 0; }
  .more {
    min-width: 52px; min-height: 40px; border-radius: 10px; background: var(--chip);
    color: var(--muted); font-weight: 800; letter-spacing: 1px; flex: none;
  }
  .menu-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .panel { margin: 8px 0; }
  textarea, input.text {
    width: 100%; font: inherit; color: inherit; padding: 12px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  }
  textarea { resize: vertical; }
  .ex-note {
    font-size: 15px; margin-top: 6px; padding: 6px 10px; border-radius: 10px;
    background: var(--chip); white-space: pre-wrap;
  }
  .stall-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .stall-row .btn { min-height: 40px; padding: 0 14px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; margin: 12px 0 6px; border-radius: 14px; background: var(--chip); }
  .seg button { min-height: 44px; border-radius: 10px; font-weight: 600; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, .18); }
  .list-row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    width: 100%; min-height: 56px; border-top: 1px solid var(--line); text-align: left;
  }
  .eyebrow + .list-row { border-top: 0; }
  .list-row .meta { white-space: nowrap; }
  .badge.small { min-width: 0; padding: 4px 10px; font-size: 13px; border-radius: 999px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .key-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); display: inline-block; }
  .key-line { width: 18px; height: 2px; background: var(--accent); display: inline-block; }
  .chart { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .chart .c-grid { stroke: var(--line); stroke-width: 1; }
  .chart .c-axis { fill: var(--muted); font-size: 11px; }
  .chart .c-label { fill: var(--ink); font-size: 12px; font-weight: 700; }
  .chart .c-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .c-dot { fill: var(--ink); stroke: var(--card); stroke-width: 2; }
  .chart .c-sel { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart .c-hit { fill: transparent; cursor: pointer; }
  .readout { font-size: 15px; margin-top: 4px; }
  .vol-row { display: grid; grid-template-columns: 96px 1fr 52px; gap: 10px; align-items: center; min-height: 40px; border-top: 1px solid var(--line); font-size: 15px; }
  .vol-row .meta { text-align: right; font-variant-numeric: tabular-nums; }
  .vbar { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; }
  .vbar span { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
  .week-nav { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; text-align: center; gap: 8px; margin-bottom: 4px; }
  .week-nav .btn { padding: 0; font-size: 22px; }
  .stepper .val {
    display: grid; place-items: center; font-size: 24px; font-weight: 700;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
  }
  .rest-edit { display: grid; grid-template-columns: 64px 1fr 64px auto; gap: 8px; align-items: center; margin: 8px 0 4px; }
  .rest-edit button { min-height: 48px; border-radius: 12px; background: var(--chip); font-weight: 600; }
  .rest-edit .val { text-align: center; font-size: 20px; font-weight: 700; }
  .rest-edit .btn { padding: 0 16px; }
  body.timing .wrap { padding-bottom: calc(env(safe-area-inset-bottom) + 150px); }
  #timer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 0 16px calc(env(safe-area-inset-bottom) + 12px);
  }
  #timer[hidden] { display: none; }
  #timer .t-track { height: 4px; margin: 0 -16px; background: var(--chip); }
  #timer .t-fill { height: 100%; width: 0; background: var(--accent); }
  #timer .t-row {
    max-width: 560px; margin: 0 auto; padding-top: 10px;
    display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px 72px; gap: 8px; align-items: center;
  }
  #timer .t-row button { min-height: 56px; border-radius: 12px; background: var(--chip); font-weight: 700; }
  #timer .t-time { text-align: center; font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #timer .t-time small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #timer.over { background: var(--accent); color: var(--accent-ink); animation: flash .5s ease-in-out 6 alternate; }
  #timer.over .t-time small { color: var(--accent-ink); }
  #timer.over .t-row button, #timer.over .t-track { visibility: hidden; }
  @keyframes flash { from { opacity: 1; } to { opacity: .55; } }
  #toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px);
    max-width: 528px; margin: 0 auto; padding: 14px 16px; border-radius: 12px;
    background: var(--ink); color: var(--bg); font-weight: 600; text-align: center;
    opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; z-index: 10;
  }
  #toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="timer" hidden>
  <div class="t-track"><div class="t-fill"></div></div>
  <div class="t-row">
    <button data-act="t-minus" aria-label="30 seconds less">−30s</button>
    <div class="t-time" aria-live="off"><span class="t-clock">0:00</span><small class="t-label"></small></div>
    <button data-act="t-plus" aria-label="30 seconds more">+30s</button>
    <button data-act="t-skip">Skip</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="seed.js"></script>
<script src="engine.js"></script>
<script>
'use strict';

// ---------- Lookups over the seed data ----------

const BLOCK_NAMES = {
  phase1: 'Phase 1',
  phase2: 'Phase 2',
  maintenance: 'Maintenance',
  'phase1-no-intensifiers': 'Phase 1, no intensifiers',
};
const exerciseById = Object.fromEntries(SEED.exercises.map((e) => [e.id, e]));
const templateById = Object.fromEntries(SEED.sessions.map((t) => [t.id, t]));
const roleById = Object.fromEntries(SEED.roles.map((r) => [r.id, r]));
// The muscle a role trains, for exercises the user adds to a session.
const muscleByRole = {};
for (const t of SEED.sessions) for (const sl of t.slots) muscleByRole[sl.role] = muscleByRole[sl.role] || sl.primaryMuscle;
const EQUIPMENT = {
  barbell: ['Barbell', 2.5],
  smith: ['Smith machine', 2.5],
  plate: ['Plate-loaded', 2.5],
  dumbbell: ['Dumbbell', 2.5],
  cable: ['Cable', 2.5],
  machine: ['Pin-loaded machine', 5],
  bodyweight: ['Bodyweight', 2.5],
};
const INCREMENTS = [0.5, 1, 1.25, 2, 2.5, 4, 5, 10];

// ---------- Storage ----------
// Everything is loaded into S at launch and written through to IndexedDB the
// moment it changes, so a killed app loses nothing that was logged.

// S.meta holds every other record of the meta store by key:
//   exercise:<id>  the user's changes to an exercise (name, increment, rest,
//                  notes), or the whole record for an exercise they created
//   role:<id>      exercises the user added to a role's list
//   swap:<slotId>  a permanent swap
//   slot:<id>      an exercise kept in a session, with its own slot
const S = { program: null, blocks: [], sessions: [], sets: [], meta: {} };
let db;

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('x-frame', 1);
    req.onupgradeneeded = () => {
      const d = req.result;
      d.createObjectStore('meta', { keyPath: 'key' });
      for (const name of ['blocks', 'sessions', 'sets']) d.createObjectStore(name, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function getAll(store) {
  return new Promise((resolve, reject) => {
    const req = db.transaction(store).objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function write(store, op, value) {
  const tx = db.transaction(store, 'readwrite');
  tx.objectStore(store)[op](value);
  tx.onerror = () => toast('Could not save. ' + (tx.error ? tx.error.message : ''));
}
const save = (store, obj) => write(store, 'put', obj);
const remove = (store, id) => write(store, 'delete', id);

async function load() {
  db = await openDb();
  const [meta, blocks, sessions, sets] = await Promise.all(
    ['meta', 'blocks', 'sessions', 'sets'].map(getAll));
  S.blocks = blocks;
  S.sessions = sessions;
  S.sets = sets;
  S.program = meta.find((m) => m.key === 'program') || null;
  for (const m of meta) if (m.key !== 'program') S.meta[m.key] = m;
  if (!S.program) {
    const b = newBlock('phase1');
    S.program = { key: 'program', blockId: b.id, week: 1, activeSessionId: null, complete: false };
    save('meta', S.program);
  }
}

function newBlock(type) {
  const b = { id: uid(), type, lengthWeeks: 8, startedAt: Date.now() };
  S.blocks.push(b);
  save('blocks', b);
  return b;
}

// ---------- Small helpers ----------

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtKg = (w) => (w == null ? '—' : String(Math.round(w * 100) / 100));
const fmtRir = (r) => (r >= 5 ? '5+' : String(r));
const fmtRange = ([lo, hi]) => (lo === hi ? String(lo) : `${lo}–${hi}`);

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

const blockById = (id) => S.blocks.find((b) => b.id === id);
const sessionById = (id) => S.sessions.find((s) => s.id === id);
const currentBlock = () => blockById(S.program.blockId);
const activeSession = () => (S.program.activeSessionId ? sessionById(S.program.activeSessionId) : null);
const usesPhase2Labels = (type) => type === 'phase2' || type === 'maintenance';
const slotLabel = (slot, type) => (usesPhase2Labels(type) ? slot.labelP2 : slot.label);
const weekTitle = (block, week) =>
  `${BLOCK_NAMES[block.type]} · Week ${week}${Engine.isDeloadWeek(week) ? ' · Deload' : ''}`;

function putMeta(rec) {
  S.meta[rec.key] = rec;
  save('meta', rec);
}

function dropMeta(key) {
  delete S.meta[key];
  remove('meta', key);
}

// An exercise with the user's changes applied. Custom exercises live only in
// the meta store.
function exercise(id) {
  const seed = exerciseById[id];
  const m = S.meta['exercise:' + id];
  if (!seed) return m ? { ...m } : null;
  return m ? { ...seed, ...m, id } : seed;
}

function setExerciseFields(id, fields) {
  const key = 'exercise:' + id;
  putMeta({ ...(S.meta[key] || { key }), ...fields });
}

const restFor = (ex) => ex.restSeconds;
const setRest = (id, seconds) => setExerciseFields(id, { restSeconds: seconds });

function roleExerciseIds(roleId) {
  const extra = (S.meta['role:' + roleId] || {}).exerciseIds || [];
  return [...new Set([...roleById[roleId].exerciseIds, ...extra])];
}

function addToRole(roleId, exerciseId) {
  if (roleExerciseIds(roleId).includes(exerciseId)) return;
  const key = 'role:' + roleId;
  const rec = S.meta[key] || { key, exerciseIds: [] };
  putMeta({ ...rec, exerciseIds: [...rec.exerciseIds, exerciseId] });
}

function createExercise(name, roleId, equipment, incrementKg) {
  const role = roleById[roleId];
  const id = 'custom-' + uid();
  putMeta({
    key: 'exercise:' + id,
    id,
    name,
    role: roleId,
    type: role.type,
    equipment,
    incrementKg,
    restSeconds: role.type === 'C' ? 150 : 90,
    isCustom: true,
  });
  addToRole(roleId, id);
  return id;
}

// The template's slots plus any exercises the user kept in that session.
function templateSlots(templateId) {
  const kept = Object.values(S.meta)
    .filter((m) => m.key.startsWith('slot:') && m.templateId === templateId)
    .sort((a, b) => a.createdAt - b.createdAt);
  return [...templateById[templateId].slots, ...kept];
}

// Every slot on a session's screen, including today-only additions.
const sessionSlots = (session) => [...templateSlots(session.templateId), ...(session.added || [])];

const permanentExerciseId = (slot) =>
  (S.meta['swap:' + slot.id] || {}).exerciseId || slot.defaultExercise;

// Today's swap wins over a permanent one, which wins over the default.
const exerciseFor = (slot, session) =>
  exercise((session.swaps || {})[slot.id] || permanentExerciseId(slot));

const fmtTime = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;

// ---------- Rest timer ----------
// The timer keeps an absolute end time in the program state, so it survives
// the app being closed. It can only alert while the app is open on screen:
// iOS gives web apps no background or lock-screen alerts.

let audioCtx = null;

// iOS only lets a page make sound after a tap, so every tap wakes the audio.
function wakeAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  if (!audioCtx) audioCtx = new Ctx();
  if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
}

// Three short beeps.
function beep() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + 0.02;
  for (let i = 0; i < 3; i++) {
    const t = t0 + i * 0.3;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.6, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.25);
  }
}

function startTimer(seconds, label) {
  S.program.timer = { endsAt: Date.now() + seconds * 1000, total: seconds, label };
  save('meta', S.program);
  tickTimer();
}

function adjustTimer(deltaSeconds) {
  const t = S.program.timer;
  if (!t) return;
  t.endsAt += deltaSeconds * 1000;
  t.total = Math.max(1, t.total + deltaSeconds);
  if (t.endsAt <= Date.now()) { stopTimer(); return; }
  save('meta', S.program);
  tickTimer();
}

function stopTimer() {
  S.program.timer = null;
  save('meta', S.program);
  tickTimer();
}

let overUntil = 0; // the end-of-rest flash shows until this time

function tickTimer() {
  const el = document.getElementById('timer');
  const t = S.program && S.program.timer;
  const now = Date.now();
  if (t && now >= t.endsAt) {
    // A rest that ran out while the app was closed or hidden ends quietly.
    if (document.visibilityState === 'visible' && now - t.endsAt < 3000) {
      beep();
      overUntil = now + 3000;
    }
    S.program.timer = null;
    save('meta', S.program);
  }
  const live = S.program && S.program.timer;
  if (live) {
    const left = Math.max(0, Math.ceil((live.endsAt - now) / 1000));
    el.classList.remove('over');
    el.querySelector('.t-clock').textContent = fmtTime(left);
    el.querySelector('.t-label').textContent = 'Rest · ' + live.label;
    el.querySelector('.t-fill').style.width = `${Math.min(100, (1 - left / live.total) * 100)}%`;
    el.hidden = false;
  } else if (now < overUntil) {
    el.classList.add('over');
    el.querySelector('.t-clock').textContent = 'Go';
    el.querySelector('.t-label').textContent = 'Rest over · next set';
    el.hidden = false;
  } else {
    el.hidden = true;
    el.classList.remove('over');
  }
  document.body.classList.toggle('timing', !el.hidden);
}

setInterval(tickTimer, 250);

// ---------- Screen wake lock ----------
// While a session is in progress the screen stays on, so auto-lock never
// cuts off the rest timer. iOS drops the lock whenever the app is hidden, so
// it is asked for again on every return and every tap. Where the API is
// missing (iOS before 16.4), nothing happens.

let wakeLock = null;

function syncWakeLock() {
  if (!('wakeLock' in navigator)) return;
  const want = !!(S.program && activeSession()) && document.visibilityState === 'visible';
  if (want && !wakeLock) {
    wakeLock = 'pending';
    navigator.wakeLock.request('screen').then((lock) => {
      wakeLock = lock;
      lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
      syncWakeLock(); // releases it again if the session ended while waiting
    }).catch(() => { wakeLock = null; });
  } else if (!want && wakeLock && wakeLock !== 'pending') {
    const lock = wakeLock;
    wakeLock = null;
    lock.release().catch(() => {});
  }
}

document.addEventListener('visibilitychange', () => {
  tickTimer();
  syncWakeLock();
});

// ---------- Program state ----------

function statusOf(templateId) {
  const logs = S.sessions.filter((s) =>
    s.blockId === S.program.blockId && s.week === S.program.week && s.templateId === templateId);
  for (const status of ['finished', 'skipped', 'in-progress']) {
    if (logs.some((l) => l.status === status)) return status;
  }
  return 'todo';
}

const nextTemplate = () => SEED.sessions.find((t) => statusOf(t.id) === 'todo');

// A week ends when all six sessions are finished or skipped. After Phase 1
// week 8 comes Phase 2 week 1; after Phase 2 week 8 the program is complete.
function advanceIfWeekDone() {
  const p = S.program;
  const done = SEED.sessions.every((t) => ['finished', 'skipped'].includes(statusOf(t.id)));
  if (!done) return;
  const b = currentBlock();
  if (p.week < b.lengthWeeks) {
    p.week += 1;
  } else if (b.type === 'phase1') {
    p.blockId = newBlock('phase2').id;
    p.week = 1;
  } else {
    p.complete = true;
  }
  save('meta', p);
}

function startSession(templateId) {
  if (activeSession()) return;
  const s = {
    id: uid(),
    templateId,
    blockId: S.program.blockId,
    week: S.program.week,
    startedAt: Date.now(),
    finishedAt: null,
    status: 'in-progress',
    weightOverrides: {},
  };
  S.sessions.push(s);
  save('sessions', s);
  S.program.activeSessionId = s.id;
  save('meta', S.program);
  ui.drafts = {};
  ui.openKey = null;
  show('session', { scrollToNext: true });
}

function skipSession(templateId) {
  const now = Date.now();
  const s = {
    id: uid(), templateId, blockId: S.program.blockId, week: S.program.week,
    startedAt: now, finishedAt: now, status: 'skipped', weightOverrides: {},
  };
  S.sessions.push(s);
  save('sessions', s);
  advanceIfWeekDone();
  toast(`${templateById[templateId].name} skipped`);
  render();
}

// ---------- Targets ----------

// First work sets of one slot and exercise, oldest first, in the shape
// Engine.replayBaseline takes. Phase 2's first entry after Phase 1 is marked
// so its target resets to the bottom of the range.
function firstSetEntries(slotId, exerciseId) {
  const bySession = new Map();
  for (const x of S.sets) {
    if (x.kind !== 'work' || x.slotId !== slotId || x.exerciseId !== exerciseId) continue;
    if (x.setIndex !== 0 && !x.makeBaseline) continue;
    const cur = bySession.get(x.sessionId);
    // A set the user made the baseline stands in for that session's first set.
    if (!cur || (x.makeBaseline && !cur.makeBaseline)) bySession.set(x.sessionId, x);
  }
  const list = [...bySession.values()].sort((a, b) =>
    sessionById(a.sessionId).startedAt - sessionById(b.sessionId).startedAt);
  let prevType = null;
  return list.map((x) => {
    const session = sessionById(x.sessionId);
    const type = blockById(session.blockId).type;
    const entry = {
      weight: x.weight,
      reps: x.reps,
      makeBaseline: !!x.makeBaseline,
      phaseStart: type === 'phase2' && prevType !== null && prevType !== 'phase2',
      sessionId: x.sessionId,
      startedAt: session.startedAt,
      type,
    };
    prevType = type;
    return entry;
  });
}

// Everything a slot needs on the session screen: the exercise, its shared
// target for every set, the target RIR, how many sets, and whether it stalled.
// The target comes from sessions before this one only, so logging set 1
// today never moves the target for sets 2 and on.
// exerciseId picks the exercise when planning a past session from history,
// since today's swaps and permanent swaps may have changed since.
function planFor(slot, session, exerciseId) {
  const block = blockById(session.blockId);
  const ex = exerciseId ? exercise(exerciseId) : exerciseFor(slot, session);
  const extra = (session.extraSets || {})[slot.id] || 0;
  if (slot.oneOff) {
    // A today-only exercise has no baseline: it starts from the last weight
    // used on that lift anywhere, at the bottom of the range.
    return {
      slot, ex, kind: 'extra', label: '+', stalled: false,
      target: { weight: latestWeight(ex.id, session), reps: slot.repLow },
      rir: Engine.targetRir(SEED.rir, block.type, session.week, ex.type),
      n: slot.sets.phase1,
      rows: slot.sets.phase1 + extra,
    };
  }
  const prior = firstSetEntries(slot.id, ex.id).filter((e) => e.startedAt < session.startedAt);
  const { baseline, results } = Engine.replayBaseline(prior, slot.repLow, slot.repHigh, ex.incrementKg);
  const deload = Engine.isDeloadWeek(session.week);
  const lastType = prior.length ? prior[prior.length - 1].type : null;
  let target;
  if (deload) target = Engine.deloadTarget(baseline, slot.repLow);
  else if (block.type === 'phase2' && lastType && lastType !== 'phase2') target = Engine.phaseStartTarget(baseline, slot.repLow);
  else target = Engine.nextTarget(baseline, slot.repLow, slot.repHigh, ex.incrementKg);
  const n = Engine.setsFor(slot, block.type, session.week);
  return {
    slot,
    ex,
    target,
    rir: Engine.targetRir(SEED.rir, block.type, session.week, ex.type),
    n,
    rows: n + extra, // planned sets plus any the user added today
    kind: deload ? 'deload' : 'work',
    label: slotLabel(slot, block.type),
    stalled: Engine.isStalled(results.map((r) => r.result)),
  };
}

function plansFor(session) {
  return sessionSlots(session)
    .map((slot) => planFor(slot, session))
    .filter((p) => p.n > 0);
}

// The plan a logged set was judged against, worked out again from history so
// edits and deletions earlier on always give the right answer.
function planForLogged(set) {
  const session = sessionById(set.sessionId);
  const slot = session && sessionSlots(session).find((s) => s.id === set.slotId);
  return slot ? planFor(slot, session, set.exerciseId) : null;
}

function liveResult(set) {
  const p = planForLogged(set);
  return p ? Engine.judgeSet(p.target, set, p.slot.repLow) : set.result;
}

// "Make this my baseline": one chosen set per session, slot and exercise.
function toggleBaseline(setId) {
  const set = S.sets.find((x) => x.id === setId);
  const on = !set.makeBaseline;
  for (const x of S.sets) {
    if (x.sessionId === set.sessionId && x.slotId === set.slotId && x.exerciseId === set.exerciseId && x.makeBaseline) {
      x.makeBaseline = false;
      save('sets', x);
    }
  }
  set.makeBaseline = on;
  save('sets', set);
  toast(on ? 'Baseline set from this set' : 'Baseline back to normal');
}

// Extra sets and today-only exercises are logged but never change a baseline.
const kindOfRow = (plan, i) => (i >= plan.n ? 'extra' : plan.kind);

// The most recent weight logged on an exercise before this session.
function latestWeight(exerciseId, session) {
  let best = null;
  for (const x of S.sets) {
    if (x.exerciseId !== exerciseId || x.sessionId === session.id) continue;
    if (!best || x.loggedAt > best.loggedAt) best = x;
  }
  return best ? best.weight : null;
}

// Slots sharing a letter (D1, D2) alternate set by set, so they share a card.
// Today-only exercises always get a card of their own.
function groupPlans(plans) {
  const groups = [];
  for (const p of plans) {
    const last = groups[groups.length - 1];
    if (last && !p.slot.oneOff && !last[0].slot.oneOff && last[0].label[0] === p.label[0]) last.push(p);
    else groups.push([p]);
  }
  return groups;
}

// A set row belongs to the slot and the exercise in it, so after a swap the
// rows start fresh and the old exercise's sets stay in its own history.
const setLogFor = (session, plan, i) =>
  S.sets.find((x) => x.sessionId === session.id && x.slotId === plan.slot.id &&
    x.exerciseId === plan.ex.id && x.setIndex === i);

// The most recent earlier session's sets for this slot and exercise, hits and
// misses alike. A today-only exercise matches the lift wherever it was done.
function lastTime(plan, session) {
  const matches = (x) => x.exerciseId === plan.ex.id && (plan.slot.oneOff || x.slotId === plan.slot.id);
  let best = null;
  for (const x of S.sets) {
    if (!matches(x) || x.sessionId === session.id) continue;
    const s = sessionById(x.sessionId);
    if (s.startedAt >= session.startedAt) continue;
    if (!best || s.startedAt > best.startedAt) best = s;
  }
  if (!best) return null;
  return S.sets
    .filter((x) => x.sessionId === best.id && matches(x))
    .sort((a, b) => a.setIndex - b.setIndex);
}

// ---------- UI state ----------

const ui = {
  view: 'home',
  openKey: null, // the set row whose editor is open, as "slotId:setIndex"
  drafts: {}, // unsaved edits per set row
  armed: null, // a button waiting for its confirming second tap
  restEdit: null, // the exercise whose rest time is being changed
  menuFor: null, // the slot whose card menu is open
  panel: null, // an open panel on a card: { kind: 'notes' | 'edit', slotId }
  swap: null, // the swap screen: { slotId, mode: 'today' | 'permanent', all, creating }
  add: null, // the add-exercise screen: { exerciseId, mode: 'today' | 'keep', sets, low, high, all, creating }
  hist: null, // history: { origin, stack: [{ page, id }], edit, draft, chartPt, volIdx }
  summary: null,
  scrollToNext: false,
};

function show(view, opts = {}) {
  ui.view = view;
  ui.armed = null;
  ui.scrollToNext = !!opts.scrollToNext;
  render();
  if (!opts.keepScroll && !ui.scrollToNext) window.scrollTo(0, 0);
}

// Two-tap confirm in place of a dialog: the first tap arms the button.
function arm(id) {
  if (ui.armed === id) { ui.armed = null; return true; }
  ui.armed = id;
  render();
  return false;
}

function draftFor(plan, session, i) {
  const key = `${plan.slot.id}:${i}`;
  if (ui.drafts[key]) return ui.drafts[key];
  const log = setLogFor(session, plan, i);
  if (log) return { weight: log.weight, reps: log.reps, rir: log.rir, applyRest: false };
  let weight = (session.weightOverrides || {})[plan.slot.id];
  if (weight == null) weight = plan.target.weight;
  // First time on a slot there is no target weight, so later sets take the
  // weight just logged on an earlier set.
  if (weight == null) {
    for (let j = i - 1; j >= 0 && weight == null; j--) {
      const earlier = setLogFor(session, plan, j);
      if (earlier) weight = earlier.weight;
    }
  }
  return {
    weight,
    reps: plan.target.reps,
    rir: Engine.prefillRir(plan.rir),
    applyRest: false,
  };
}

// ---------- Views ----------

function render() {
  const app = document.getElementById('app');
  if (ui.view === 'session' && activeSession()) app.innerHTML = sessionView();
  else if (ui.view === 'summary' && ui.summary) app.innerHTML = summaryView();
  else if (ui.view === 'settings') app.innerHTML = settingsView();
  else if (ui.view === 'swap' && activeSession() && ui.swap) app.innerHTML = swapView();
  else if (ui.view === 'add' && activeSession() && ui.add) app.innerHTML = addView();
  else if (ui.view === 'history' && ui.hist) app.innerHTML = historyView();
  else { ui.view = 'home'; app.innerHTML = homeView(); }
  syncWakeLock();
  if (ui.scrollToNext) {
    ui.scrollToNext = false;
    const next = app.querySelector('.set.next');
    if (next) next.scrollIntoView({ block: 'center' });
  }
}

function homeView() {
  const block = currentBlock();
  const active = activeSession();
  const next = nextTemplate();
  let hero;
  if (S.program.complete) {
    hero = `<div class="card"><h3>Program complete</h3>
      <p class="meta">Phase 2 is finished. Choosing what runs next comes in a later build. Settings can move you to any phase and week.</p></div>`;
  } else if (active) {
    hero = `<div class="card"><div class="eyebrow">In progress</div>
      <h3>${esc(templateById[active.templateId].name)}</h3>
      <button class="btn primary big" data-act="resume">Resume</button></div>`;
  } else if (next) {
    const count = plansFor({ templateId: next.id, blockId: block.id, week: S.program.week, startedAt: Infinity, id: '' }).length;
    hero = `<div class="card"><div class="eyebrow">Up next</div>
      <h3>${esc(next.name)}</h3>
      <div class="meta">${count} exercises</div>
      <button class="btn primary big" data-act="start" data-arg="${next.id}">Start</button></div>`;
  }

  const rows = SEED.sessions.map((t) => {
    const st = statusOf(t.id);
    let right = '';
    if (st === 'finished') right = '<span class="pill hit">Done</span>';
    else if (st === 'skipped') right = '<span class="pill">Skipped</span>';
    else if (st === 'in-progress') right = '<span class="pill now">In progress</span>';
    else if (!active && !S.program.complete) {
      const armed = ui.armed === 'skip:' + t.id;
      right = `<button class="btn ${armed ? 'armed' : ''}" data-act="skip" data-arg="${t.id}">${armed ? 'Skip it' : 'Skip'}</button>
        <button class="btn" data-act="start" data-arg="${t.id}">Start</button>`;
    }
    return `<div class="week-row"><div class="name">${esc(t.name)}</div>${right}</div>`;
  }).join('');

  return `<div class="wrap">
    <div class="top"><div><button class="link" data-act="hist-open">History</button></div>
      <div class="mid eyebrow">X Frame</div>
      <button class="link right" data-act="settings">Settings</button></div>
    <h2>${esc(weekTitle(block, S.program.week))}</h2>
    ${hero || ''}
    <div class="card"><div class="eyebrow">This week</div>${rows}</div>
  </div>`;
}

function sessionView() {
  const session = activeSession();
  const block = blockById(session.blockId);
  const plans = plansFor(session);

  // The next set is the first unlogged one in template order, alternating
  // within pairs.
  let nextKey = null;
  const groups = groupPlans(plans);
  for (const g of groups) {
    for (const i of rowOrder(g)) {
      const [p, idx] = i;
      if (!nextKey && !setLogFor(session, p, idx)) nextKey = `${p.slot.id}:${idx}`;
    }
  }

  const notes = [];
  if (block.type === 'phase1' && session.week === 1) {
    notes.push('Settle on your form and keep it for the rest of the program, so later gains are real.');
  }
  if (Engine.isDeloadWeek(session.week)) {
    notes.push('Deload week: half the sets at your baseline weight. These sets never change a baseline.');
  }

  const unlogged = plans.some((p) => [...Array(p.rows).keys()].some((i) => !setLogFor(session, p, i)));
  const finishArmed = ui.armed === 'finish';

  return `<div class="wrap">
    <div class="top">
      <div><button class="link" data-act="home">‹ Home</button></div>
      <div class="mid"><b>${esc(templateById[session.templateId].name)}</b>
        <span class="eyebrow">${esc(weekTitle(block, session.week))}</span></div>
      <div class="right"><button class="btn ${finishArmed ? 'armed' : 'primary'}" data-act="finish" data-arg="${unlogged ? 'confirm' : ''}">${finishArmed ? 'Finish now' : 'Finish'}</button></div>
    </div>
    ${notes.map((n) => `<div class="note">${esc(n)}</div>`).join('')}
    ${groups.map((g) => groupCard(g, session, nextKey)).join('')}
    <button class="btn big" data-act="add-open">+ Add exercise</button>
  </div>`;
}

// Rows of a group as [plan, setIndex], alternating set by set within a pair.
function rowOrder(group) {
  const rows = [];
  const most = Math.max(...group.map((p) => p.rows));
  for (let i = 0; i < most; i++) for (const p of group) if (i < p.rows) rows.push([p, i]);
  return rows;
}

function exerciseHead(p, session) {
  const last = lastTime(p, session);
  const lastText = last ? last.map((x) => `${fmtKg(x.weight)}×${x.reps}`).join(', ') : 'first time';
  const slotId = p.slot.id;
  const menuOpen = ui.menuFor === slotId;
  const panel = ui.panel && ui.panel.slotId === slotId ? ui.panel.kind : null;
  const anyLogged = S.sets.some((x) => x.sessionId === session.id && x.slotId === slotId);
  const swapped = (session.swaps || {})[slotId] ? ' · swapped today' : '';
  let menu = '';
  if (menuOpen) {
    menu = `<div class="menu-row">
      ${p.slot.oneOff ? '' : `<button class="btn" data-act="swap-open" data-arg="${slotId}">Swap</button>`}
      <button class="btn" data-act="add-set" data-arg="${slotId}">Add set</button>
      <button class="btn" data-act="panel" data-arg="notes" data-key="${slotId}">Notes</button>
      <button class="btn" data-act="panel" data-arg="edit" data-key="${slotId}">Edit</button>
      <button class="btn" data-act="hist-open-ex" data-arg="${p.ex.id}">History</button>
      ${p.slot.oneOff && !anyLogged ? `<button class="btn" data-act="added-remove" data-arg="${slotId}">Remove</button>` : ''}
    </div>`;
  }
  let panelHtml = '';
  if (panel === 'notes') {
    panelHtml = `<div class="panel">
      <div class="lab">Notes for ${esc(p.ex.name)} (seat height, grip, machine number)</div>
      <textarea data-field="notes" data-arg="${p.ex.id}" rows="3">${esc(p.ex.notes || '')}</textarea>
      <div class="actions"><button class="btn primary" data-act="panel-close">Done</button></div>
    </div>`;
  } else if (panel === 'edit') {
    const incOpts = INCREMENTS.map((v) => `<option value="${v}" ${v === p.ex.incrementKg ? 'selected' : ''}>${fmtKg(v)} kg</option>`).join('');
    panelHtml = `<div class="panel">
      <div class="lab">Name</div>
      <input class="text" id="edit-name" value="${esc(p.ex.name)}" autocomplete="off">
      <div class="lab">Weight steps</div>
      <select id="edit-inc">${incOpts}</select>
      <div class="actions">
        <button class="btn primary" data-act="edit-save" data-arg="${p.ex.id}">Save</button>
        <button class="btn" data-act="panel-close">Cancel</button>
      </div>
    </div>`;
  }
  return `<div class="ex-head">
    <div class="ex-title">
      <div class="ex-name"><span class="tag">${esc(p.label)}</span>${esc(p.ex.name)}</div>
      <button class="more" data-act="menu" data-arg="${slotId}" aria-label="Options for ${esc(p.ex.name)}">•••</button>
    </div>
    <div class="meta">${p.slot.repLow}–${p.slot.repHigh} reps · RIR ${fmtRange(p.rir)} · Last: ${esc(lastText)}${swapped}${p.slot.oneOff ? ' · today only' : ''}</div>
    ${p.ex.notes && panel !== 'notes' ? `<div class="ex-note">${esc(p.ex.notes)}</div>` : ''}
    <button class="inline-link" data-act="rest-edit" data-arg="${p.ex.id}">Rest ${fmtTime(restFor(p.ex))}</button>
    ${ui.restEdit === p.ex.id ? `<div class="rest-edit">
      <button data-act="rest-minus" data-arg="${p.ex.id}" aria-label="15 seconds less">−15s</button>
      <div class="val">${fmtTime(restFor(p.ex))}</div>
      <button data-act="rest-plus" data-arg="${p.ex.id}" aria-label="15 seconds more">+15s</button>
      <button class="btn" data-act="rest-edit" data-arg="${p.ex.id}">Done</button>
    </div>` : ''}
    ${p.stalled ? `<div class="stall-row"><span class="pill miss">Stalled: 3 misses in a row</span>
      <button class="btn" data-act="swap-open" data-arg="${slotId}">Swap</button></div>` : ''}
    ${menu}${panelHtml}
  </div>`;
}

function groupCard(group, session, nextKey) {
  const heads = group.map((p) => exerciseHead(p, session)).join('');
  const paired = group.length > 1;
  const rows = rowOrder(group).map(([p, i]) => setRow(p, session, i, paired, nextKey)).join('');
  return `<div class="card">${heads}${rows}</div>`;
}

function setRow(plan, session, i, paired, nextKey) {
  const key = `${plan.slot.id}:${i}`;
  const log = setLogFor(session, plan, i);
  const open = ui.openKey === key;
  const d = draftFor(plan, session, i);
  const extra = i >= plan.n ? '<br>extra' : '';
  const label = `${paired ? `<span class="tag">${esc(plan.label)}</span><br>` : ''}Set ${i + 1}${extra}`;
  let vals, right;
  if (log && !open) {
    const result = Engine.judgeSet(plan.target, log, plan.slot.repLow);
    const easy = Engine.easierThanPlanned(result, log.rir, plan.rir);
    vals = `${fmtKg(log.weight)} kg × ${log.reps} · RIR ${fmtRir(log.rir)}${easy ? '<small>Easier than planned</small>' : ''}`;
    const word = { hit: 'Hit', miss: 'Miss', first: 'Logged' }[result];
    right = `<div class="badge ${result}">${word}</div>`;
  } else {
    vals = `${d.weight == null ? '—' : fmtKg(d.weight)} kg × ${d.reps} · RIR ${fmtRir(d.rir)}`;
    right = log
      ? '<div></div>'
      : `<button class="btn primary done" data-act="done" data-key="${key}">${d.weight == null ? 'Enter' : 'Done'}</button>`;
  }
  const cls = ['set', log ? 'logged' : '', key === nextKey ? 'next' : ''].join(' ');
  return `<div class="${cls}">
    <div class="label">${label}</div>
    <button class="vals" data-act="open" data-key="${key}">${vals}</button>
    ${right}
    ${open ? editor(plan, session, i, d, log) : ''}
  </div>`;
}

function editor(plan, session, i, d, log) {
  const key = `${plan.slot.id}:${i}`;
  const laterUnlogged = [...Array(plan.rows).keys()].some((j) => j > i && !setLogFor(session, plan, j));
  // The last added set can be taken away again until it is logged.
  const removable = !log && i >= plan.n && i === plan.rows - 1;
  const chips = [0, 1, 2, 3, 4, 5].map((r) =>
    `<button class="${d.rir === r ? 'on' : ''}" data-act="rir" data-key="${key}" data-arg="${r}">${fmtRir(r)}</button>`).join('');
  const delArmed = ui.armed === 'del:' + key;
  return `<div class="editor">
    <div class="lab">Weight (kg) · steps of ${fmtKg(plan.ex.incrementKg)}</div>
    <div class="stepper">
      <button data-act="w-" data-key="${key}" aria-label="Less weight">−</button>
      <input data-field="weight" data-key="${key}" inputmode="decimal" value="${d.weight == null ? '' : fmtKg(d.weight)}" placeholder="kg" aria-label="Weight in kg">
      <button data-act="w+" data-key="${key}" aria-label="More weight">+</button>
    </div>
    <div class="lab">Reps · target ${plan.target.reps}</div>
    <div class="stepper">
      <button data-act="r-" data-key="${key}" aria-label="Fewer reps">−</button>
      <input data-field="reps" data-key="${key}" inputmode="numeric" value="${d.reps}" aria-label="Reps">
      <button data-act="r+" data-key="${key}" aria-label="More reps">+</button>
    </div>
    <div class="lab">Reps in reserve · target ${fmtRange(plan.rir)}</div>
    <div class="chips">${chips}</div>
    ${laterUnlogged ? `<button class="toggle ${d.applyRest ? 'on' : ''}" data-act="apply" data-key="${key}">
      <span class="box">${d.applyRest ? '✓' : ''}</span>Use this weight for the remaining sets</button>` : ''}
    <div class="actions">
      <button class="btn primary" data-act="done" data-key="${key}">${log ? 'Save' : 'Log set'}</button>
      ${log ? `<button class="btn ${delArmed ? 'armed' : ''}" data-act="del" data-key="${key}">${delArmed ? 'Delete set' : 'Delete'}</button>` : ''}
      ${removable ? `<button class="btn" data-act="remove-set" data-key="${key}">Remove set</button>` : ''}
      <button class="btn" data-act="cancel" data-key="${key}">Cancel</button>
    </div>
    ${log && log.kind === 'work' ? `<button class="btn big" data-act="make-base" data-arg="${log.id}">
      ${log.makeBaseline ? 'Stop using as my baseline' : 'Make this my baseline'}</button>` : ''}
  </div>`;
}

function summaryView() {
  const s = ui.summary;
  const list = (items) => items.map((x) => `<div class="sum-row"><span>${esc(x[0])}</span><span class="meta">${esc(x[1])}</span></div>`).join('');
  return `<div class="wrap">
    <div class="top"><div></div><div class="mid"><b>${esc(s.name)} finished</b></div><div></div></div>

function exerciseRows(ids, act) {
  return ids.map((id) => {
    const ex = exercise(id);

// Every role's exercises except those listed, one card per role.
function otherRoleCards(skipIds, act) {

const seg = (act, value, options) => `<div class="seg">${options.map(([v, label]) =>

function swapView() {
  const session = activeSession();
  const sw = ui.swap;
  const slot = sessionSlots(session).find((s) => s.id === sw.slotId);
  const plan = planFor(slot, session);
  const role = roleById[slot.role];
  const current = plan.ex;
  const permanent = exercise(permanentExerciseId(slot));
  const todayId = (session.swaps || {})[slot.id];
  const logged = S.sets.some((x) => x.sessionId === session.id && x.slotId === slot.id && x.exerciseId === current.id);
  const roleIds = roleExerciseIds(slot.role).filter((id) => id !== current.id);
  const undo = [];
  if (sw.mode === 'today' && todayId) {
    undo.push(`<button class="btn big" data-act="swap-pick" data-arg="${permanent.id}">Back to ${esc(permanent.name)}</button>`);
  }
  if (sw.mode === 'permanent' && permanent.id !== slot.defaultExercise) {
    const def = exercise(slot.defaultExercise);
    undo.push(`<button class="btn big" data-act="swap-pick" data-arg="${def.id}">Back to the default, ${esc(def.name)}</button>`);
  }
  return `<div class="wrap">
    <div class="top"><div><button class="link" data-act="screen-close">‹ Back</button></div>
      <div class="mid"><b>Swap exercise</b><span class="eyebrow">${esc(plan.label)} · ${esc(role.name)}</span></div><div></div></div>
    <div class="card">
      <div class="eyebrow">Now</div><h3>${esc(current.name)}</h3>
      ${seg('swap-mode', sw.mode, [['today', 'Today only'], ['permanent', 'Permanent']])}
      <div class="meta">${sw.mode === 'today'
        ? `Just this session. Next time it's ${esc(permanent.name)} again.`
        : 'From now on, in this slot, in every phase.'}</div>
      ${logged ? `<div class="note">The sets you've logged on ${esc(current.name)} today stay in its history.</div>` : ''}
      ${undo.join('')}
    </div>
    <div class="card"><div class="eyebrow">${esc(role.name)} alternatives</div>${exerciseRows(roleIds, 'swap-pick')}</div>
    ${sw.all ? otherRoleCards([...roleIds, current.id], 'swap-pick')
      : '<button class="btn big" data-act="list-all">Show every exercise</button>'}
    ${sw.creating ? newExerciseForm(slot.role) : '<button class="btn big" data-act="new-ex">+ New exercise</button>'}

}

function addView() {

// ---------- History ----------
// History is a stack of pages opened from home or from a session; Back pops
// the stack and, at the bottom, returns to where it was opened from.

const fmtDate = (ms) => {
  const d = new Date(ms);
  const opts = { weekday: 'short', day: 'numeric', month: 'short' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('en-GB', opts);
};

const sessionTitle = (s) => `${fmtDate(s.startedAt)} · ${weekTitle(blockById(s.blockId), s.week)}`;

function openHistory(origin, page, id) {
  if (origin === 'session') sessionScroll = window.scrollY;
  ui.menuFor = null;
  ui.hist = { origin, stack: [{ page, id }], edit: null, draft: null, chartPt: null, volIdx: 0 };
  show('history');
}

function histPush(page, id) {
  ui.hist.stack.push({ page, id });
  ui.hist.edit = null;
  ui.hist.chartPt = null;
  show('history');
}

function histBack() {
  ui.hist.stack.pop();
  ui.hist.edit = null;
  ui.hist.chartPt = null;
  if (ui.hist.stack.length) { show('history'); return; }
  const origin = ui.hist.origin;
  ui.hist = null;
  if (origin === 'session' && activeSession()) closeScreen();
  else show('home');
}

function historyView() {
  const { page, id } = ui.hist.stack[ui.hist.stack.length - 1];
  const pages = {
    main: histMain,
    exercises: histExercises,
    exercise: histExercise,
    sessions: histSessions,
    session: histSession,
    volume: histVolume,
  };
  const [title, body] = pages[page](id);
  return `<div class="wrap">
    <div class="top"><div><button class="link" data-act="hist-back">‹ Back</button></div>
      <div class="mid"><b>${esc(title)}</b></div><div></div></div>
    ${body}
  </div>`;
}

// Slots whose current exercise has missed three sessions in a row.
function stalledSlots() {
  const out = [];
  for (const t of SEED.sessions) {
    for (const slot of templateSlots(t.id)) {
      const exId = permanentExerciseId(slot);
      const ex = exercise(exId);
      const { results } = Engine.replayBaseline(firstSetEntries(slot.id, exId), slot.repLow, slot.repHigh, ex.incrementKg);
      if (Engine.isStalled(results.map((r) => r.result))) out.push({ t, slot, ex });
    }
  }
  return out;
}

function histMain() {
  const stalls = stalledSlots();
  const finished = S.sessions.filter((s) => s.status !== 'in-progress').length;
  const exCount = new Set(S.sets.map((x) => x.exerciseId)).size;
  return ['History', `
    <div class="card"><div class="eyebrow">Stalled</div>
      ${stalls.length
        ? stalls.map(({ t, slot, ex }) => `<div class="sum-row"><span>${esc(ex.name)}</span><span class="meta">${esc(t.name)} · ${esc(slot.labelP2)}</span></div>`).join('')
        : '<div class="meta">Nothing has stalled.</div>'}
    </div>
    <div class="card">
      <button class="list-row" data-act="hist-go" data-arg="exercises"><span>Exercises</span><span class="meta">${exCount} ›</span></button>
      <button class="list-row" data-act="hist-go" data-arg="sessions"><span>Sessions</span><span class="meta">${finished} ›</span></button>
      <button class="list-row" data-act="hist-go" data-arg="volume"><span>Weekly volume</span><span class="meta">›</span></button>
    </div>
    <button class="btn big" data-act="export-csv" ${S.sets.length ? '' : 'disabled'}>Export CSV</button>
    <p class="meta">One row per set, for a backup or a spreadsheet.</p>`];
}

function histExercises() {
  const last = new Map();
  const sessionsFor = new Map();
  for (const x of S.sets) {
    if (!last.has(x.exerciseId) || x.loggedAt > last.get(x.exerciseId)) last.set(x.exerciseId, x.loggedAt);
    if (!sessionsFor.has(x.exerciseId)) sessionsFor.set(x.exerciseId, new Set());
    sessionsFor.get(x.exerciseId).add(x.sessionId);
  }
  const ids = [...last.keys()].sort((a, b) => last.get(b) - last.get(a));
  const rows = ids.map((id) => {
    const n = sessionsFor.get(id).size;
    return `<button class="list-row" data-act="hist-go" data-arg="exercise" data-key="${id}">
      <span>${esc(exercise(id).name)}</span><span class="meta">${n} session${n === 1 ? '' : 's'} · ${fmtDate(last.get(id))}</span></button>`;
  }).join('');
  return ['Exercises', `<div class="card">${rows || '<div class="meta">Nothing logged yet.</div>'}</div>`];
}

// Best work set per session, oldest first: the chart's data. Deload, drop and
// extra sets are left out.
function chartPoints(exerciseId) {
  const best = new Map();
  for (const x of S.sets) {
    if (x.exerciseId !== exerciseId || x.kind !== 'work') continue;
    const e = Engine.epley(x.weight, x.reps);
    const cur = best.get(x.sessionId);
    if (!cur || e > cur.e1rm) best.set(x.sessionId, { weight: x.weight, reps: x.reps, e1rm: e, at: sessionById(x.sessionId).startedAt });
  }
  return [...best.values()].sort((a, b) => a.at - b.at);
}

// A tick step of 1, 2, 2.5 or 5 times a power of ten, giving about four lines.
function niceStep(range) {
  const raw = range / 4;
  const pow = 10 ** Math.floor(Math.log10(raw));
  for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * pow) return m * pow;
  return 10 * pow;
}

function exerciseChart(points) {
  if (points.length < 2) {
    return '<div class="meta">The chart starts after two sessions of this lift.</div>';
  }
  const W = 340, H = 190, L = 34, R = 14, T = 14, B = 26;
  const lo = Math.min(...points.map((p) => p.weight));
  const hi = Math.max(...points.map((p) => p.e1rm));
  const step = niceStep(Math.max(hi - lo, 5));
  // A quarter step of headroom so points never sit on the chart's edges.
  const y0 = Math.max(0, Math.floor((lo - step / 4) / step) * step);
  const y1 = Math.ceil((hi + step / 4) / step) * step;
  const x = (i) => L + (i * (W - L - R)) / (points.length - 1);
  const y = (v) => T + ((y1 - v) * (H - T - B)) / (y1 - y0);
  let grid = '';
  for (let v = y0; v <= y1 + 1e-9; v += step) {
    grid += `<line class="c-grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>
      <text class="c-axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmtKg(v)}</text>`;
  }
  const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.e1rm).toFixed(1)}`).join('');
  const sel = ui.hist.chartPt == null ? points.length - 1 : ui.hist.chartPt;
  const dots = points.map((p, i) => `<circle class="c-dot" cx="${x(i)}" cy="${y(p.weight)}" r="${i === sel ? 6 : 4.5}"/>`).join('');
  const colW = (W - L - R) / (points.length - 1);
  const hits = points.map((p, i) =>
    `<rect class="c-hit" data-act="chart-pt" data-arg="${i}" x="${x(i) - colW / 2}" y="0" width="${colW}" height="${H}"/>`).join('');
  const last = points[points.length - 1];
  const sp = points[sel];
  return `<div class="legend"><span><i class="key-dot"></i>Best set (kg)</span><span><i class="key-line"></i>Estimated 1RM (kg)</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Best set and estimated one-rep max per session">
      ${grid}
      <line class="c-sel" x1="${x(sel)}" x2="${x(sel)}" y1="${T}" y2="${H - B}"/>
      <path class="c-line" d="${line}"/>
      ${dots}
      <text class="c-label" x="${x(points.length - 1) - 4}" y="${y(last.e1rm) - 8}" text-anchor="end">${fmtKg(Math.round(last.e1rm))}</text>
      <text class="c-axis" x="${L}" y="${H - 6}">${esc(fmtDate(points[0].at))}</text>
      <text class="c-axis" x="${W - R}" y="${H - 6}" text-anchor="end">${esc(fmtDate(last.at))}</text>
      ${hits}
    </svg>
    <div class="readout">${esc(fmtDate(sp.at))}: best set ${fmtKg(sp.weight)} kg × ${sp.reps} · estimated 1RM ${fmtKg(Math.round(sp.e1rm * 10) / 10)} kg</div>`;
}

function histExercise(id) {
  const ex = exercise(id);
  const sets = S.sets.filter((x) => x.exerciseId === id);
  const sessionIds = [...new Set(sets.map((x) => x.sessionId))]
    .sort((a, b) => sessionById(b).startedAt - sessionById(a).startedAt);
  const groups = sessionIds.map((sid) => {
    const s = sessionById(sid);
    const rows = sets.filter((x) => x.sessionId === sid)
      .sort((a, b) => a.slotId.localeCompare(b.slotId) || a.setIndex - b.setIndex)
      .map(histSetRow).join('');
    return `<div class="card"><div class="eyebrow">${esc(sessionTitle(s))} · ${esc(templateById[s.templateId].name)}</div>${rows}</div>`;
  }).join('');
  return [ex.name, `<div class="card">${exerciseChart(chartPoints(id))}</div>${groups}`];
}

function histSessions() {
  const list = S.sessions.filter((s) => s.status !== 'in-progress' || s.id === S.program.activeSessionId)
    .sort((a, b) => b.startedAt - a.startedAt);
  let html = '';
  let lastWeek = null;
  for (const s of list) {
    const wk = s.blockId + ':' + s.week;
    if (wk !== lastWeek) {
      if (lastWeek) html += '</div>';
      html += `<div class="card"><div class="eyebrow">${esc(weekTitle(blockById(s.blockId), s.week))}</div>`;
      lastWeek = wk;
    }
    const n = S.sets.filter((x) => x.sessionId === s.id).length;
    const status = s.status === 'skipped' ? 'Skipped' : s.status === 'in-progress' ? 'In progress' : `${n} sets`;
    html += `<button class="list-row" data-act="hist-go" data-arg="session" data-key="${s.id}">
      <span>${esc(templateById[s.templateId].name)}<br><span class="meta">${esc(fmtDate(s.startedAt))}</span></span>
      <span class="meta">${status} ›</span></button>`;
  }
  if (lastWeek) html += '</div>';
  return ['Sessions', html || '<div class="card"><div class="meta">No sessions yet.</div></div>'];
}

function histSession(id) {
  const s = sessionById(id);
  const name = templateById[s.templateId].name;
  if (s.status === 'skipped') return [name, `<div class="card"><div class="eyebrow">${esc(sessionTitle(s))}</div><div class="meta">Skipped. No sets were logged.</div></div>`];
  const sets = S.sets.filter((x) => x.sessionId === id);
  const cards = sessionSlots(s).map((slot) => {
    const mine = sets.filter((x) => x.slotId === slot.id);
    const exIds = [...new Set(mine.map((x) => x.exerciseId))];
    const label = slotLabel(slot, blockById(s.blockId).type) || '';
    return exIds.map((exId) => `<div class="card">
      <div class="ex-name"><span class="tag">${esc(label)}</span>${esc(exercise(exId).name)}</div>
      ${mine.filter((x) => x.exerciseId === exId).sort((a, b) => a.setIndex - b.setIndex).map(histSetRow).join('')}
    </div>`).join('');
  }).join('');
  return [name, `<div class="eyebrow">${esc(sessionTitle(s))}</div>${cards || '<div class="card"><div class="meta">No sets logged.</div></div>'}`];
}

// Weeks with any session in them, newest first, with the current week always
// included.
function volumeWeeks() {
  const seen = new Map();
  const add = (blockId, week) => { if (!seen.has(blockId + ':' + week)) seen.set(blockId + ':' + week, { blockId, week }); };
  add(S.program.blockId, S.program.week);
  for (const s of S.sessions) add(s.blockId, s.week);
  return [...seen.values()].sort((a, b) =>
    blockById(b.blockId).startedAt - blockById(a.blockId).startedAt || b.week - a.week);
}

function histVolume() {
  const weeks = volumeWeeks();
  const idx = Math.min(ui.hist.volIdx, weeks.length - 1);
  const { blockId, week } = weeks[idx];
  const block = blockById(blockId);
  const planned = Engine.weeklyVolume(SEED.sessions.map((t) => ({ slots: templateSlots(t.id) })), block.type, week);
  const done = {};
  for (const s of S.sessions) {
    if (s.blockId !== blockId || s.week !== week) continue;
    const slots = sessionSlots(s);
    for (const x of S.sets) {
      if (x.sessionId !== s.id || x.kind === 'drop') continue;
      const slot = slots.find((sl) => sl.id === x.slotId);
      if (slot) done[slot.primaryMuscle] = (done[slot.primaryMuscle] || 0) + 1;
    }
  }
  const muscles = [...new Set([...Object.keys(planned), ...Object.keys(done)])]
    .filter((m) => planned[m] || done[m])
    .sort((a, b) => (planned[b] || 0) - (planned[a] || 0));
  const rows = muscles.map((m) => {
    const d = done[m] || 0, p = planned[m] || 0;
    const pct = p ? Math.min(100, (d / p) * 100) : 100;
    return `<div class="vol-row"><span>${esc(m)}</span>
      <span class="vbar"><span style="width:${pct}%"></span></span>
      <span class="meta">${d} / ${p}</span></div>`;
  }).join('');
  return ['Weekly volume', `
    <div class="card">
      <div class="week-nav">
        <button class="btn" data-act="vol-week" data-arg="1" ${idx >= weeks.length - 1 ? 'disabled' : ''} aria-label="Earlier week">‹</button>
        <b>${esc(weekTitle(block, week))}</b>
        <button class="btn" data-act="vol-week" data-arg="-1" ${idx === 0 ? 'disabled' : ''} aria-label="Later week">›</button>
      </div>
      <div class="meta">Hard sets logged against the plan, per muscle.</div>
      ${rows}
    </div>`];
}

// ---------- CSV export ----------

function csvCell(v) {
  const s = v == null ? '' : String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function buildCsv() {
  const head = ['Date', 'Time', 'Phase', 'Week', 'Session', 'Slot', 'Exercise', 'Set', 'Kind',
    'Target kg', 'Target reps', 'Target RIR', 'kg', 'Reps', 'RIR', 'Result', 'Chosen as baseline'];
  const plans = new Map(); // one plan per session, slot and exercise
  const rows = [...S.sets].sort((a, b) => a.loggedAt - b.loggedAt).map((x) => {
    const s = sessionById(x.sessionId);
    const block = blockById(s.blockId);
    const pk = `${x.sessionId}|${x.slotId}|${x.exerciseId}`;
    if (!plans.has(pk)) plans.set(pk, planForLogged(x));
    const p = plans.get(pk);
    const d = new Date(x.loggedAt);
    const pad = (n) => String(n).padStart(2, '0');
    return [
      `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
      `${pad(d.getHours())}:${pad(d.getMinutes())}`,
      BLOCK_NAMES[block.type], s.week, templateById[s.templateId].name,
      p ? p.label : '', exercise(x.exerciseId).name, x.setIndex + 1, x.kind,
      p ? p.target.weight : x.targetWeight, p ? p.target.reps : x.targetReps,
      fmtRange(p ? p.rir : x.targetRir),
      x.weight, x.reps, x.rir,
      p ? Engine.judgeSet(p.target, x, p.slot.repLow) : x.result,
      x.makeBaseline ? 'yes' : '',
    ];
  });
  return [head, ...rows].map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
}

// The share sheet on iPhone (Save to Files, Mail, AirDrop); a download elsewhere.
function exportCsv() {
  const d = new Date();
  const name = `x-frame-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.csv`;
  const file = new File([buildCsv()], name, { type: 'text/csv' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'X Frame history' }).catch(() => {});
    return;
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function settingsView() {
  const block = currentBlock();
  const active = activeSession();
  const types = ['phase1', 'phase2'];
  const typeOpts = types.map((t) => `<option value="${t}" ${block.type === t ? 'selected' : ''}>${BLOCK_NAMES[t]}</option>`).join('');
  const weekOpts = [1, 2, 3, 4, 5, 6, 7, 8].map((w) => `<option value="${w}" ${S.program.week === w ? 'selected' : ''}>Week ${w}</option>`).join('');
  return `<div class="wrap">
    <div class="top"><div><button class="link" data-act="home">‹ Home</button></div><div class="mid"><b>Settings</b></div><div></div></div>
    <div class="card">
      <div class="eyebrow">Move to a phase and week</div>
      <p class="meta">For restarts or corrections. Your logged sets and baselines are kept.</p>
      ${active ? '<div class="note">Finish the session in progress first.</div>' : ''}
      <div class="lab">Phase</div><select id="set-type" ${active ? 'disabled' : ''}>${typeOpts}</select>
      <div class="lab">Week</div><select id="set-week" ${active ? 'disabled' : ''}>${weekOpts}</select>
      <button class="btn primary big" data-act="settings-save" ${active ? 'disabled' : ''}>Move</button>
    </div>
