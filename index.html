}

// ---------- Actions ----------

function planForKey(key) {
  const session = activeSession();
  const [slotId, idx] = key.split(':');
  const slot = sessionSlots(session).find((s) => s.id === slotId);
  return { session, plan: planFor(slot, session), i: Number(idx) };
}

function forgetDrafts(slotId) {
  for (const k of Object.keys(ui.drafts)) if (k.startsWith(slotId + ':')) delete ui.drafts[k];
  if (ui.openKey && ui.openKey.startsWith(slotId + ':')) ui.openKey = null;
}

// Swap and Add exercise are full screens over the session. Leaving them puts
// the session back where it was scrolled.
let sessionScroll = 0;

function openScreen(view) {
  sessionScroll = window.scrollY;
  ui.menuFor = null;
  ui.panel = null;
  show(view);
}

function closeScreen() {
  ui.swap = null;
  ui.add = null;
  ui.hist = null;
  show('session', { keepScroll: true });
  window.scrollTo(0, sessionScroll);
}

function pickSwap(exerciseId) {
  const session = activeSession();
  const slot = sessionSlots(session).find((s) => s.id === ui.swap.slotId);
  const swaps = { ...(session.swaps || {}) };
  if (ui.swap.mode === 'today') {
    if (exerciseId === permanentExerciseId(slot)) delete swaps[slot.id];
    else swaps[slot.id] = exerciseId;
  } else {
    if (exerciseId === slot.defaultExercise) dropMeta('swap:' + slot.id);
    else putMeta({ key: 'swap:' + slot.id, slotId: slot.id, exerciseId });
    delete swaps[slot.id];
  }
  session.swaps = swaps;
  save('sessions', session);
  addToRole(slot.role, exerciseId);
  forgetDrafts(slot.id);
  toast(`${exercise(exerciseId).name}${ui.swap.mode === 'today' ? ' for today' : ' from now on'}`);
  closeScreen();
}

function createFromForm() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) { toast('Give the exercise a name'); return; }
  const roleEl = document.getElementById('new-role');
  const roleId = ui.view === 'swap'
    ? sessionSlots(activeSession()).find((s) => s.id === ui.swap.slotId).role
    : roleEl.value;
  const id = createExercise(name, roleId,
    document.getElementById('new-eq').value, Number(document.getElementById('new-inc').value));
  if (ui.view === 'swap') pickSwap(id);
  else pickAdd(id);
}

function pickAdd(exerciseId) {
  const ex = exercise(exerciseId);
  const [low, high] = ex.type === 'C' ? [8, 12] : [10, 15];
  ui.add = { ...ui.add, exerciseId, creating: false, sets: 3, low, high };
  show('add');
}

// The letter after the last one in a session, for a kept exercise's slot.
function nextLetter(slots) {
  const codes = slots.map((s) => s.labelP2).filter(Boolean).map((l) => l.charCodeAt(0));
  return String.fromCharCode(Math.max(64, ...codes) + 1);
}

function confirmAdd() {
  const session = activeSession();
  const a = ui.add;
  const ex = exercise(a.exerciseId);
  const base = {
    role: ex.role,
    defaultExercise: ex.id,
    primaryMuscle: muscleByRole[ex.role],
    sets: { phase1: a.sets, phase2: a.sets },
    repLow: a.low,
    repHigh: a.high,
    dropSetEligible: false,
    userAdded: true,
  };
  if (a.mode === 'today') {
    session.added = [...(session.added || []), { ...base, id: 'today-' + uid(), label: '+', labelP2: '+', oneOff: true }];
    save('sessions', session);
  } else {
    const letter = nextLetter(templateSlots(session.templateId));
    const id = 'user-' + uid();
    putMeta({
      ...base, key: 'slot:' + id, id, templateId: session.templateId,
      label: letter + '1', labelP2: letter + '1', pairGroup: letter, createdAt: Date.now(),
    });
  }
  toast(`${ex.name} added`);
  ui.add = null;
  show('session', { keepScroll: true });
  window.scrollTo(0, document.body.scrollHeight);
}

function changeExtraSets(slotId, delta) {
  const session = activeSession();
  const extra = { ...(session.extraSets || {}) };
  extra[slotId] = Math.max(0, (extra[slotId] || 0) + delta);
  session.extraSets = extra;
  save('sessions', session);
}

function editDraft(key, change) {
  const { session, plan, i } = planForKey(key);
  const d = { ...draftFor(plan, session, i) };
  change(d, plan);
  ui.drafts[key] = d;
  ui.openKey = key;
  render();
}

function logSet(key) {
  const { session, plan, i } = planForKey(key);
  const d = draftFor(plan, session, i);
  if (d.weight == null || !(d.weight > 0) || !(d.reps >= 0)) {
    ui.openKey = key;
    render();
    toast('Enter the weight you lifted');
    return;
  }
  const result = Engine.judgeSet(plan.target, d, plan.slot.repLow);
  const existing = setLogFor(session, plan, i);
  const rec = existing
    ? { ...existing, weight: d.weight, reps: d.reps, rir: d.rir, result }
    : {
        id: uid(),
        sessionId: session.id,
        slotId: plan.slot.id,
        exerciseId: plan.ex.id,
        setIndex: i,
        kind: kindOfRow(plan, i),
        targetWeight: plan.target.weight,
        targetReps: plan.target.reps,
        targetRir: plan.rir,
        weight: d.weight,
        reps: d.reps,
        rir: d.rir,
        result,
        loggedAt: Date.now(),
        makeBaseline: false,
      };
  if (existing) S.sets[S.sets.indexOf(existing)] = rec;
  else S.sets.push(rec);
  save('sets', rec);
  // A newly logged set starts the rest; saving an edit to an old one doesn't.
  if (!existing) startTimer(restFor(plan.ex), plan.ex.name);
  if (d.applyRest) {
    session.weightOverrides = { ...session.weightOverrides, [plan.slot.id]: d.weight };
    // Unlogged drafts for this slot pick up the new weight.
    for (const k of Object.keys(ui.drafts)) {
      if (k.startsWith(plan.slot.id + ':') && k !== key) delete ui.drafts[k];
    }
    save('sessions', session);
  }
  delete ui.drafts[key];
  ui.openKey = null;
  render();
}

function deleteSet(key) {
  const { session, plan, i } = planForKey(key);
  const log = setLogFor(session, plan, i);
  if (!log) return;
  S.sets.splice(S.sets.indexOf(log), 1);
  remove('sets', log.id);
  delete ui.drafts[key];
  ui.openKey = null;
  render();
}

function finishSession() {
  const session = activeSession();
  const plans = plansFor(session);
  const logs = S.sets.filter((x) => x.sessionId === session.id);
  const summary = {
    name: templateById[session.templateId].name,
    hits: 0, misses: 0, firsts: 0, baselines: [], stalls: [],
  };
  for (const p of plans) {
    for (const x of logs.filter((l) => l.slotId === p.slot.id && l.exerciseId === p.ex.id)) {
      const r = Engine.judgeSet(p.target, x, p.slot.repLow);
      summary[{ hit: 'hits', miss: 'misses', first: 'firsts' }[r]] += 1;
    }
    if (p.kind !== 'work') continue;
    const first = setLogFor(session, p, 0);
    if (!first) continue;
    const entries = firstSetEntries(p.slot.id, p.ex.id).filter((e) => e.startedAt <= session.startedAt);
    const { baseline, results } = Engine.replayBaseline(entries, p.slot.repLow, p.slot.repHigh, p.ex.incrementKg);
    if (results[results.length - 1].result !== 'miss') {
      summary.baselines.push([p.ex.name, `${fmtKg(baseline.weight)} kg × ${baseline.reps}`]);
    }
    if (Engine.isStalled(results.map((r) => r.result))) summary.stalls.push([p.ex.name, '3 misses in a row']);
  }
  session.status = 'finished';
  session.finishedAt = Date.now();
  save('sessions', session);
  S.program.activeSessionId = null;
  save('meta', S.program);
  advanceIfWeekDone();
  ui.summary = summary;
  ui.drafts = {};
  ui.openKey = null;
  show('summary');
}

function moveTo(type, week) {
  if (activeSession()) return;
  if (type !== currentBlock().type) S.program.blockId = newBlock(type).id;
  S.program.week = week;
  S.program.complete = false;
  save('meta', S.program);
  toast(`Moved to ${BLOCK_NAMES[type]} · Week ${week}`);
  show('home');
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const { act, key, arg } = el.dataset;
  wakeAudio();
  syncWakeLock();
  if (ui.armed && !['skip', 'finish', 'del', 'h-del'].includes(act)) ui.armed = null;
  switch (act) {
    case 't-minus': adjustTimer(-30); return;
    case 't-plus': adjustTimer(30); return;
    case 't-skip': stopTimer(); return;
    case 'rest-edit': ui.restEdit = ui.restEdit === arg ? null : arg; render(); break;
    case 'rest-minus': setRest(arg, Math.max(15, restFor(exercise(arg)) - 15)); render(); break;
    case 'rest-plus': setRest(arg, Math.min(600, restFor(exercise(arg)) + 15)); render(); break;
    case 'menu': ui.menuFor = ui.menuFor === arg ? null : arg; ui.panel = null; render(); break;
    case 'panel': ui.panel = { kind: arg, slotId: key }; ui.menuFor = null; render(); break;
    case 'panel-close': ui.panel = null; render(); break;
    case 'edit-save': {
      const name = document.getElementById('edit-name').value.trim();
      if (!name) { toast('The name can’t be empty'); break; }
      setExerciseFields(arg, { name, incrementKg: Number(document.getElementById('edit-inc').value) });
      ui.panel = null;
      render();
      break;
    }
    case 'add-set': changeExtraSets(arg, 1); ui.menuFor = null; render(); break;
    case 'remove-set': changeExtraSets(key.split(':')[0], -1); delete ui.drafts[key]; ui.openKey = null; render(); break;
    case 'added-remove': {
      const session = activeSession();
      session.added = (session.added || []).filter((s) => s.id !== arg);
      save('sessions', session);
      forgetDrafts(arg);
      ui.menuFor = null;
      render();
      break;
    }
    case 'swap-open': ui.swap = { slotId: arg, mode: 'today', all: false, creating: false }; openScreen('swap'); break;
    case 'swap-mode': ui.swap.mode = arg; render(); break;
    case 'swap-pick': pickSwap(arg); break;
    case 'add-open': ui.add = { exerciseId: null, mode: 'today', creating: false }; openScreen('add'); break;
    case 'add-pick': pickAdd(arg); break;
    case 'add-back': ui.add = { ...ui.add, exerciseId: null }; show('add'); break;
    case 'add-mode': ui.add.mode = arg; render(); break;
    case 'add-sets': ui.add.sets = Math.min(10, Math.max(1, ui.add.sets + Number(arg))); render(); break;
    case 'add-low': ui.add.low = Math.min(ui.add.high, Math.max(1, ui.add.low + Number(arg))); render(); break;
    case 'add-high': ui.add.high = Math.min(50, Math.max(ui.add.low, ui.add.high + Number(arg))); render(); break;
    case 'add-confirm': confirmAdd(); break;
    case 'list-all': ui.swap.all = true; render(); break;
    case 'new-ex': (ui.swap || ui.add).creating = true; render(); document.getElementById('new-name').focus(); break;
    case 'new-ex-cancel': (ui.swap || ui.add).creating = false; render(); break;
    case 'create-ex': createFromForm(); break;
    case 'screen-close': closeScreen(); break;
    case 'make-base': toggleBaseline(arg); ui.openKey = null; render(); break;
    case 'hist-open': openHistory('home', 'main'); break;
    case 'hist-open-ex': openHistory('session', 'exercise', arg); break;
    case 'hist-go': histPush(arg, key); break;
    case 'hist-back': histBack(); break;
    case 'hist-edit': {
      if (ui.hist.edit === arg) { ui.hist.edit = null; render(); break; }
      const set = S.sets.find((x) => x.id === arg);
      ui.hist.edit = arg;
      ui.hist.draft = { weight: set.weight, reps: set.reps, rir: set.rir };
      render();
      break;
    }
    case 'h-w': {
      const set = S.sets.find((x) => x.id === ui.hist.edit);
      const inc = exercise(set.exerciseId).incrementKg;
      const d = ui.hist.draft;
      d.weight = Math.max(0, Engine.roundDownToIncrement((d.weight || 0) + Number(arg) * inc, inc));
      render();
      break;
    }
    case 'h-r': ui.hist.draft.reps = Math.max(0, ui.hist.draft.reps + Number(arg)); render(); break;
    case 'h-rir': ui.hist.draft.rir = Number(arg); render(); break;
    case 'h-cancel': ui.hist.edit = null; render(); break;
    case 'h-save': {
      const set = S.sets.find((x) => x.id === ui.hist.edit);
      const d = ui.hist.draft;
      if (!(d.weight > 0)) { toast('Enter the weight you lifted'); break; }
      Object.assign(set, { weight: d.weight, reps: d.reps, rir: d.rir });
      set.result = liveResult(set);
      save('sets', set);
      ui.hist.edit = null;
      toast('Set saved');
      render();
      break;
    }
    case 'h-del': {
      const id = ui.hist.edit;
      if (!arm('hdel:' + id)) break;
      const set = S.sets.find((x) => x.id === id);
      S.sets.splice(S.sets.indexOf(set), 1);
      remove('sets', id);
      ui.hist.edit = null;
      toast('Set deleted');
      render();
      break;
    }
    case 'h-base': toggleBaseline(ui.hist.edit); ui.hist.edit = null; render(); break;
    case 'chart-pt': ui.hist.chartPt = Number(arg); render(); break;
    case 'vol-week': ui.hist.volIdx = Math.max(0, ui.hist.volIdx + Number(arg)); render(); break;
    case 'export-csv': exportCsv(); break;
    case 'start': startSession(arg); break;
    case 'resume': show('session', { scrollToNext: true }); break;
    case 'skip': if (arm('skip:' + arg)) skipSession(arg); break;
    case 'home': show('home'); break;
    case 'settings': show('settings'); break;
    case 'settings-save':
      moveTo(document.getElementById('set-type').value, Number(document.getElementById('set-week').value));
      break;
    case 'finish': if (!arg || arm('finish')) finishSession(); break;
    case 'summary-done': ui.summary = null; show('home'); break;
    case 'open':
      if (ui.openKey === key) { ui.openKey = null; } else { ui.openKey = key; }
      render();
      break;
    case 'cancel': delete ui.drafts[key]; ui.openKey = null; render(); break;
    case 'done': logSet(key); break;
    case 'del': if (arm('del:' + key)) deleteSet(key); break;
    case 'w-': editDraft(key, (d, p) => { d.weight = Math.max(0, Engine.roundDownToIncrement((d.weight || 0) - p.ex.incrementKg, p.ex.incrementKg)); }); break;
    case 'w+': editDraft(key, (d, p) => { d.weight = Engine.roundDownToIncrement((d.weight || 0) + p.ex.incrementKg, p.ex.incrementKg); }); break;
    case 'r-': editDraft(key, (d) => { d.reps = Math.max(0, d.reps - 1); }); break;
    case 'r+': editDraft(key, (d) => { d.reps += 1; }); break;
    case 'rir': editDraft(key, (d) => { d.rir = Number(arg); }); break;
    case 'apply': editDraft(key, (d) => { d.applyRest = !d.applyRest; }); break;
  }
});

// Typed values update the draft without a re-render, so the keyboard stays up.
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.dataset.field === 'notes') { setExerciseFields(el.dataset.arg, { notes: el.value }); return; }
  if (el.dataset.field === 'h-weight' || el.dataset.field === 'h-reps') {
    const v = parseFloat(el.value.replace(',', '.'));
    if (el.dataset.field === 'h-weight') ui.hist.draft.weight = Number.isFinite(v) ? v : null;
    else ui.hist.draft.reps = Number.isFinite(v) ? Math.round(v) : 0;
    return;
  }
  if (el.dataset.field !== 'weight' && el.dataset.field !== 'reps') return;
  const { session, plan, i } = planForKey(el.dataset.key);
  const d = { ...draftFor(plan, session, i) };
  const v = parseFloat(el.value.replace(',', '.'));
  if (el.dataset.field === 'weight') d.weight = Number.isFinite(v) ? v : null;
  else d.reps = Number.isFinite(v) ? Math.round(v) : 0;
  ui.drafts[el.dataset.key] = d;
});

// Picking equipment in the new-exercise form sets its usual weight step.
document.addEventListener('change', (ev) => {
  if (ev.target.id !== 'new-eq') return;
  document.getElementById('new-inc').value = String(EQUIPMENT[ev.target.value][1]);
});

// Offline support. Skipped on file:// and anywhere service workers are absent.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

load().then(() => {
  if (activeSession()) show('session', { scrollToNext: true });
  else render();
}).catch((err) => {
  document.getElementById('app').innerHTML =
    `<div class="wrap"><div class="card"><h3>X Frame could not start</h3><p class="meta">${esc(err.message || err)}</p></div></div>`;
});
</script>
</body>
</html>
